<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>RSVP リーダー</title>
<meta name="description" content="日本語の文章を、文節ごとに一か所へ次々と表示して読む（RSVP）">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Zen+Old+Mincho:wght@400&display=swap" rel="stylesheet">
<!-- 고딕 자리의 라틴 文字·數字: Halv Sans (Alegreya Sans) -->
<link rel="stylesheet" href="/fonts/sans/sans.css?v=1">
<!-- 한글: 本文 은바탕, UI 은돋움 (블로그·사전과 같은 것) -->
<link rel="stylesheet" href="/fonts/un/unbatang.css?v=2">
<link rel="stylesheet" href="/fonts/un/undotum.css?v=2">
<!-- 寫硏 書體 (TypeSquare): 本文 石井明朝 オールド R, UI 石井ゴシック R. 登錄한 도메인에서만 나오고, 없으면 Zen Old Mincho 로 -->
<script type="text/javascript" src="//typesquare.com/accessor/ko/script/typesquare.js?ee85a1e0da0743cc9ca6031dd3b19c5d" charset="utf-8"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   블로그(b.halv.kr)·사전(d.halv.kr)과 같은 紙面: 종이 빛, 먹, 草綠 한 가지.
   本文은 明朝, UI 는 고딕. 상자 대신 가는 줄, 단추 대신 글자.
   ══════════════════════════════════════════════════════════════ */

/* ── tokens (블로그 style.css 와 같은 값) ── */
:root {
  color-scheme: light dark;
  --color-bg: #fdfcf9;
  --color-bg-alt: #f3f0e8;
  --color-text: #1c1b18;
  --accent-l: 0.56;
  --accent-c: 0.10;
  --color-accent: oklch(var(--accent-l) var(--accent-c) 141);
  --color-border: #e9e5db;
  --color-border-strong: #d5cfc1;
  --color-rule: #bdb6a6;
  --color-muted-2: #736e65;
  --color-muted-3: #78736a;
  --color-muted-4: #a19b90;

  --font-mincho: "Newsreader", "IshiiMincho Old R", "UnBatang", "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "AppleMyungjo", serif;
  /* 입력欄用: TypeSquare 는 textarea 의 글꼴을 다루지 못하고 이름을 바꿔 버리므로, 寫硏 書體를 빼고 Zen Old Mincho 로 */
  --font-mincho-plain: "Newsreader", "UnBatang", "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "AppleMyungjo", serif;
  --font-gothic: "Halv Sans", "IshiiGothic R", "UnDotum", "Hiragino Sans", "Yu Gothic", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --weight-regular: 350;

  --fs-caption: 0.85rem;
  --fs-ui: 0.875rem;
  --fs-body: 0.926rem;
  --fs-word: clamp(1.9rem, 6.8vw, 2.9rem);

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 18px;
  --sp-5: 28px;
  --sp-6: 44px;

  --pill: 999px;
  --measure: 34rem;
  --bar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #16161a;
    --color-bg-alt: #201f24;
    --color-text: #e7e5e0;
    --accent-l: 0.78;
    --accent-c: 0.085;
    --color-border: #2c2c30;
    --color-border-strong: #3d3c41;
    --color-rule: #4a494e;
    --color-muted-2: #9a9994;
    --color-muted-3: #85837e;
    --color-muted-4: #706e69;
  }
}

/* ── base ── */
* { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
html, body { margin: 0; }
body {
  min-height: 100svh;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-gothic);
  font-weight: var(--weight-regular);
  line-height: 1.6;
}
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ── page ── */
.page {
  width: min(var(--measure), calc(100% - 2 * var(--sp-4)));
  margin: 0 auto;
  padding: var(--sp-5) 0 var(--sp-6);
}
.page.is-reading { padding-bottom: 0; }

/* ── 柱: 위 끝의 작은 글자 한 줄과 그 아래 가는 줄 ── */
.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  padding-bottom: 6px;
  border-bottom: 1px solid var(--color-border-strong);
  font-size: 13px;
  line-height: 16px;
  color: var(--color-muted-3);
}
.head__title { color: var(--color-text); }
.head a { color: inherit; text-decoration: none; }
.head a:hover { color: var(--color-accent); }
.head__time { font-variant-numeric: tabular-nums; }

/* ── 글자 단추 ── */
.tbtn {
  -webkit-appearance: none;
  appearance: none;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: var(--color-muted-2);
  font-family: var(--font-gothic);
  font-size: var(--fs-ui);
  line-height: 2rem;
  cursor: pointer;
  transition: color .15s ease;
}
.tbtn:hover { color: var(--color-text); }
.tbtn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.tbtn--go { color: var(--color-accent); }
.tbtn--go:hover { color: var(--color-accent); text-decoration: underline; text-underline-offset: .25em; }
.head .tbtn { font-size: 13px; line-height: 16px; color: var(--color-muted-3); }
.head .tbtn:hover { color: var(--color-accent); }

/* ── 本文 입력: 상자 없이 밑줄 하나. 누르면 밑줄만 草綠 ── */
.source {
  display: block;
  width: 100%;
  min-height: 15rem;
  margin-top: var(--sp-4);
  padding: 0 0 var(--sp-3);
  border: 0;
  border-bottom: 1px solid var(--color-border-strong);
  border-radius: 0;
  background: transparent;
  color: var(--color-text);
  font-family: var(--font-mincho-plain);
  font-size: var(--fs-body);
  line-height: 1.85;
  word-break: normal;
  line-break: strict;
  resize: vertical;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.source::placeholder { color: var(--color-muted-4); }
.source:focus { outline: none; border-bottom-color: var(--color-accent); box-shadow: 0 1px 0 var(--color-accent); }

/* ── 本文 아래 한 줄: 區切り 수·걸리는 時間 / 例文·消す ── */
.meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-top: var(--sp-1);
  font-size: var(--fs-caption);
  color: var(--color-muted-3);
  font-variant-numeric: tabular-nums;
}
.meta__acts { display: flex; gap: var(--sp-4); }

/* ── 設定 줄: 이름 — 값 (− ＋) ── */
.prefs { display: grid; gap: 2px; }
.prefs__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-5);
}
.prefs__k { font-size: 12.5px; color: var(--color-muted-3); white-space: nowrap; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper__v {
  min-width: 4.6em;
  font-size: var(--fs-ui);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.stepper__v small { margin-left: .2em; color: var(--color-muted-3); font-size: 12px; }
.round {
  -webkit-appearance: none;
  appearance: none;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 1.7rem;
  height: 1.7rem;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: var(--pill);
  background: none;
  color: var(--color-muted-3);
  font-family: var(--font-gothic);
  font-size: 1.15rem;
  line-height: 1;
  cursor: pointer;
  transition: color .15s ease, background-color .15s ease;
}
.round:hover { background: var(--color-bg-alt); color: var(--color-accent); }
.round:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.round:disabled { opacity: .28; cursor: default; }
.round:disabled:hover { background: none; color: var(--color-muted-3); }

/* 入力 畫面의 設定: 가는 줄 사이에 */
.edit-prefs {
  margin-top: var(--sp-5);
  padding: var(--sp-2) 0;
  border-block: 1px solid var(--color-border);
}

.go { margin-top: var(--sp-4); }
.keys {
  margin: var(--sp-5) 0 0;
  font-size: 12.5px;
  line-height: 1.9;
  color: var(--color-muted-4);
}
.keys kbd {
  display: inline-block;
  min-width: 1.35rem;
  padding: 0 .3em;
  border: 1px solid var(--color-border-strong);
  border-radius: 4px;
  color: var(--color-muted-3);
  font: 12px/1.35 var(--font-gothic);
  text-align: center;
}

/* ── 表示面: 가운데 한 줄. 위아래 끝에 草綠의 짧은 눈금 ── */
.stage {
  position: relative;
  display: grid;
  place-items: center;
  height: calc(100svh - var(--sp-5) - 23px - var(--bar-h));
  min-height: 14rem;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage:focus { outline: none; }   /* 읽는 동안 내내 여기에 포커스가 있으므로 테두리를 내지 않는다 */
.stage::before,
.stage::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 1px;
  height: 14px;
  background: var(--color-accent);
}
.stage::before { top: calc(50% - 3.2rem); }
.stage::after { bottom: calc(50% - 3.2rem); }
.word {
  font-family: var(--font-mincho);
  font-size: var(--fs-word);
  font-weight: 400;
  line-height: 1.3;
  letter-spacing: .03em;
  white-space: nowrap;
}
.word.is-end { font-family: var(--font-gothic); font-size: var(--fs-ui); letter-spacing: 0; color: var(--color-muted-3); }

/* ── 아래 넘김 줄 (사전과 같은 꼴): ‹ ▶ › 막대 쪽수 ── */
.statusbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  height: var(--bar-h);
  padding: 0 var(--sp-4) max(6px, env(safe-area-inset-bottom));
  font-size: var(--fs-caption);
  color: var(--color-muted-3);
}
.statusbar .round--play { color: var(--color-text); font-size: .85rem; }
.slider {
  -webkit-appearance: none;
  appearance: none;
  width: min(220px, 34vw);
  height: 3px;
  border-radius: var(--pill);
  accent-color: var(--color-accent);
  background: linear-gradient(var(--color-rule), var(--color-rule)) 0 0 / var(--p, 0%) 100% no-repeat, var(--color-border);
  cursor: pointer;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 11px;
  height: 11px;
  border: 2px solid var(--color-bg);
  border-radius: var(--pill);
  background: var(--color-accent);
}
.slider::-moz-range-thumb {
  width: 11px;
  height: 11px;
  border: 2px solid var(--color-bg);
  border-radius: var(--pill);
  background: var(--color-accent);
}
.slider::-moz-range-track { background: transparent; }
.slider::-moz-range-progress { height: 3px; border-radius: var(--pill); background: var(--color-rule); }
.folio { min-width: 4.5em; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.folio b { color: var(--color-text); font-weight: var(--weight-regular); }
.folio i { margin: 0 .3em; font-style: normal; color: var(--color-muted-4); }

/* ── 設定 (읽는 畫面): 글자 하나의 단추, 가는 테두리의 종이 한 장 ── */
.popprefs { position: relative; flex: none; }
.popprefs .tbtn { font-size: 14px; }
.popprefs .tbtn[aria-expanded="true"] { color: var(--color-text); }
.popprefs__panel {
  position: absolute;
  right: 0;
  bottom: calc(100% + 10px);
  min-width: 15rem;
  padding: 10px 14px 12px;
  border: 1px solid var(--color-border-strong);
  background: var(--color-bg);
  box-shadow: 0 6px 18px -10px rgb(0 0 0 / .25);
}
@media (min-width: 600px) {
  .popprefs {
    position: fixed;
    right: max(1.25rem, env(safe-area-inset-right));
    bottom: max(1.1rem, env(safe-area-inset-bottom));
    z-index: 40;
  }
}

/* TypeSquare 가 미리 받아 둘 글자 (보이지 않게. display:none 은 쓰지 않는다) */
.ts-glyphs {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.ts-glyphs--m { font-family: "IshiiMincho Old R"; }
.ts-glyphs--g { font-family: "IshiiGothic R"; }

@media (max-width: 480px) {
  .statusbar { gap: 6px; }
  .slider { flex: 1 1 auto; width: auto; min-width: 0; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .tbtn, .round, .source { transition: none; }
}
</style>
</head>
<body>
<main class="page" id="page">

  <!-- 入力 -->
  <section id="editView">
    <header class="head">
      <span class="head__title">RSVP リーダー</span>
      <a href="/">halv.kr</a>
    </header>
    <textarea id="source" class="source" placeholder="ここに文章を貼り付けてください。" spellcheck="false" aria-label="読む文章"></textarea>
    <div class="meta">
      <span id="info"></span>
      <span class="meta__acts">
        <button type="button" class="tbtn" id="btnSample">例文</button>
        <button type="button" class="tbtn" id="btnClear">消す</button>
      </span>
    </div>
    <div class="prefs edit-prefs" data-prefs></div>
    <div class="go"><button type="button" class="tbtn tbtn--go" id="btnStart">読み始める →</button></div>
    <p class="keys">読んでいる間は <kbd>Space</kbd> 再生・停止　<kbd>←</kbd><kbd>→</kbd> 前後　<kbd>↑</kbd><kbd>↓</kbd> 速さ　<kbd>Esc</kbd> 文章に戻る</p>
  </section>

  <!-- 表示 -->
  <section id="readView" hidden>
    <header class="head">
      <button type="button" class="tbtn" id="btnEdit">← 文章に戻る</button>
      <span class="head__time">残り <span id="remain"></span></span>
    </header>
    <div class="stage" id="stage" tabindex="0" title="クリックで再生・停止">
      <div class="word" id="word"></div>
    </div>
  </section>
</main>

<footer class="statusbar" id="statusbar" hidden>
  <button type="button" class="round" id="btnPrev" aria-label="前へ" title="前へ（←）">‹</button>
  <button type="button" class="round round--play" id="btnPlay" aria-label="再生" title="再生・停止（Space）">▶&#xFE0E;</button>
  <button type="button" class="round" id="btnNext" aria-label="次へ" title="次へ（→）">›</button>
  <input type="range" class="slider" id="seek" min="0" max="0" value="0" step="1" aria-label="位置">
  <span class="folio"><b id="posNow">1</b><i>/</i><span id="posAll">1</span></span>
  <div class="popprefs">
    <button type="button" class="tbtn" id="btnPrefs" aria-expanded="false" aria-controls="prefsPanel">設定</button>
    <div class="popprefs__panel prefs" id="prefsPanel" data-prefs hidden></div>
  </div>
</footer>

<template id="prefsRows">
  <div class="prefs__row">
    <span class="prefs__k">速さ</span>
    <span class="stepper">
      <button type="button" class="round" data-step="cpm" data-d="-50" aria-label="遅く">−</button>
      <span class="stepper__v"><span data-val="cpm"></span><small>字/分</small></span>
      <button type="button" class="round" data-step="cpm" data-d="50" aria-label="速く">+</button>
    </span>
  </div>
  <div class="prefs__row">
    <span class="prefs__k">一度に出す字数</span>
    <span class="stepper">
      <button type="button" class="round" data-step="maxLen" data-d="-1" aria-label="短く">−</button>
      <span class="stepper__v"><span data-val="maxLen"></span><small>字まで</small></span>
      <button type="button" class="round" data-step="maxLen" data-d="1" aria-label="長く">+</button>
    </span>
  </div>
</template>

<!-- TypeSquare 는 처음 읽을 때 문서에 있는 글자만 받아 온다. 붙여 넣은 글은 script 가 여기에 보태고 다시 부른다 -->
<div class="ts-glyphs ts-glyphs--m" id="tsMincho" aria-hidden="true">吾輩は猫である。名前はまだ無い。どこで生れたかとんと見当がつかぬ</div>
<div class="ts-glyphs ts-glyphs--g" aria-hidden="true">RSVPリーダー読む文章例文消す速さ一度に出す字数分まで始める→間は再生停止前後に戻る残り設定遅く短く長くここを貼り付けてください区切り約おわりでもう</div>

<script>
/* ════════════════════════════════════════════════════════════
   文節づくり
   Intl.Segmenter（なければ文字種の切れ目）で細かく切った語を、
   「自立語 + 後ろに付く助詞・助動詞・送り仮名」のまとまりに寄せる。
   ════════════════════════════════════════════════════════════ */
const RSVP = (() => {
  // 前のまとまりに付ける記号（読点・句点・閉じ括弧など）
  const CLOSE = /^[、。，．,.!?！？…‥」』）)】〕〉》］\]｝}〟’”:：;；]+$/u;
  // 次のまとまりの頭に付ける記号
  const OPEN = /^[「『（(【〔〈《［\[｛{〝‘“]+$/u;
  const STOP = /[。．.!?！？…‥]/u;
  const COMMA = /[、，,:：;；]/u;
  const PUNCT = /[\s、。，．,.!?！？…‥「」『』（）()【】〔〕〈〉《》［］\[\]｛｝{}〝〟‘’“”:：;；・]/gu;

  // 前に付く語（助詞・助動詞の切れ端）。完全一致で見る
  const FUNC = new Set(('は が を に へ と で も の や か ね よ な ぞ さ わ や ' +
    'から まで より ので のに けど けれど けれども だけ しか ばかり など ほど くらい ぐらい ずつ ' +
    'では には とは でも にも とも への での からは までは だって って ' +
    'です でし だ だっ だろ でしょ じゃ ます まし ませ ない なかっ なく ぬ ず ん ' +
    'た て ば れ られ れる られる せ させ せる させる う よう たい たかっ たく そう らしい みたい ' +
    'し して した する される ま まし ましょ いる いた いて ある あっ おり ください').split(' '));
  // 文節を閉じる助詞。この後に来る、FUNC でない平仮名は新しい文節を始める
  const ENDERS = new Set(('は が を に へ と も の や か ね よ ' +
    'から まで より ので のに けど けれど けれども だけ しか など ほど ' +
    'では には とは でも にも とも への での からは までは').split(' '));

  const kindOfChar = (ch) => {
    if (/[ぁ-ゟ]/u.test(ch)) return 'hira';
    if (/[゠-ヿㇰ-ㇿｦ-ﾟ]/u.test(ch)) return 'kata';
    if (/[一-鿿㐀-䶿豈-﫿々〆ヶ]/u.test(ch)) return 'kanji';
    if (/[0-9０-９]/u.test(ch)) return 'digit';
    if (/[A-Za-zＡ-Ｚａ-ｚ]/u.test(ch)) return 'latin';
    return 'other';
  };
  const kindOf = (s) => {
    let k = null;
    for (const ch of s) { const c = kindOfChar(ch); if (k === null) k = c; else if (k !== c) return 'mixed'; }
    return k || 'other';
  };
  const visible = (s) => [...s.replace(PUNCT, '')].length;
  // 한글: 띄어 쓴 곳이 경계(어절). 붙여 쓴 것은 漢字·括弧 뒤의 토씨까지 한 덩어리로
  const HANGUL = /[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]/u;
  // 前のまとまりから離さない語（長さの上限を少し超えてもよい）
  const SMALL = /^[っゃゅょぁぃぅぇぉゎんーッャュョァィゥェォヮン]/u;
  const dependent = (t) => FUNC.has(t) || SMALL.test(t);
  const SLACK = 4;

  // Segmenter がないとき: 長い平仮名の並びを、2 文字以上の助詞（から・では など）の前後で切る。
  // 1 文字の助詞で切ると「と|ても」のように語の中で切れてしまうので使わない
  const KNOWN = [...ENDERS].filter((w) => w.length >= 2).sort((a, b) => b.length - a.length);
  function splitHira(run) {
    const out = [];
    let i = 0, buf = '';
    while (i < run.length) {
      const m = KNOWN.find((w) => run.startsWith(w, i));
      if (m) { if (buf) { out.push(buf); buf = ''; } out.push(m); i += m.length; }
      else { buf += run[i]; i++; }
    }
    if (buf) out.push(buf);
    return out;
  }

  let segmenter = null;
  try { segmenter = new Intl.Segmenter('ja', { granularity: 'word' }); } catch (e) {}

  // 語に切る。Segmenter がないときは文字種が変わるところで切る
  function tokens(line) {
    if (segmenter) return [...segmenter.segment(line)].map((s) => s.segment);
    const out = [];
    let buf = '', prev = null;
    for (const ch of line) {
      const k = /\s/u.test(ch) ? 'space' : (CLOSE.test(ch) || OPEN.test(ch) || ch === '・') ? 'punct:' + ch : kindOfChar(ch);
      if (buf && (k !== prev || k.startsWith('punct'))) { out.push(buf); buf = ''; }
      buf += ch; prev = k;
    }
    if (buf) out.push(buf);
    return out.flatMap((t) => (t.length > 2 && kindOf(t) === 'hira' ? splitHira(t) : [t]));
  }

  // cur（いまのまとまり）に語 t を付けてよいか
  function attaches(cur, t, kind) {
    if (cur.end === 'comma' || cur.end === 'stop') return false;
    if (SMALL.test(t) && !cur.space && cur.end === '') return true;   // っ・ん などで始まる切れ端
    if (cur.space) return cur.pure === 'latin' && (kind === 'latin' || kind === 'digit');
    if (cur.end === 'close') return kind === 'hira' && FUNC.has(t);
    if (cur.joiner) return kind === 'kata' || kind === cur.pure;
    switch (kind) {
      // 助詞の後に付くのは助詞（から＋では など）と「で＋ある」だけ。ほかは新しい文節
      case 'hira':
        if (!ENDERS.has(cur.lastTok)) return true;
        return ENDERS.has(t) || (t.length === 1 && FUNC.has(t)) ||
          (cur.lastTok === 'で' && /^(ある|あっ|あり|あれ|あろ)$/u.test(t));
      case 'kanji': return cur.pure === 'kanji' || cur.pure === 'digit';
      case 'kata': return cur.pure === 'kata';
      case 'digit': return cur.pure === 'digit';
      case 'latin': return cur.pure === 'latin';
      default: return false;
    }
  }

  function chunk(text, maxLen) {
    const out = [];
    const lines = text.replace(/\r\n?/g, '\n').split(/\n+/);
    for (const line of lines) {
      if (!line.trim()) continue;
      let cur = null, open = '';
      const push = () => { if (cur) out.push(cur); cur = null; };
      const start = (t, kind) => {
        cur = { text: open + t, len: visible(t), pure: kind, lastTok: t, end: '', space: false, joiner: false, para: false, hangul: HANGUL.test(t) };
        open = '';
      };
      for (const t of tokens(line)) {
        if (/^\s+$/u.test(t)) { if (cur) cur.space = true; continue; }
        if (OPEN.test(t)) { push(); open += t; continue; }
        if (CLOSE.test(t)) {
          const target = cur || out[out.length - 1];
          if (!target) { open += t; continue; }
          target.text += t;
          target.end = STOP.test(t) ? 'stop' : COMMA.test(t) ? (target.end === 'stop' ? 'stop' : 'comma') : (target.end || 'close');
          target.lastTok = t;
          continue;
        }
        if (t === '・' && cur) { cur.text += t; cur.joiner = true; continue; }
        let kind = kindOf(t);
        if (kind === 'mixed' && kindOfChar(t[0]) === 'hira') kind = 'hira';   // 「いた事」のような切れ端
        if (!cur) { start(t, kind); continue; }
        const add = visible(t) + (cur.space ? 1 : 0);
        const limit = dependent(t) ? maxLen + SLACK : maxLen;
        const eojeol = !cur.space && (cur.hangul || HANGUL.test(t)) && cur.end !== 'comma' && cur.end !== 'stop';
        if (eojeol || (attaches(cur, t, kind) && cur.len + add <= limit)) {
          cur.text += (cur.space ? ' ' : '') + t;
          cur.len += add;
          if (cur.pure !== kind) cur.pure = 'mixed';
          cur.lastTok = t;
          cur.space = false;
          cur.joiner = false;
          if (HANGUL.test(t)) cur.hangul = true;
        } else {
          push();
          start(t, kind);
        }
      }
      if (open && out.length) out[out.length - 1].text += open;
      push();
      if (out.length) out[out.length - 1].para = true;
    }
    return out.map(({ text, len, end, para }) => ({ text, len, end, para }));
  }

  // 表示時間（ミリ秒）。1 文字あたり 60000/cpm、短いまとまりは 2 文字分、句読点と段落の後は少し長く
  function duration(c, cpm) {
    const per = 60000 / cpm;
    let ms = per * Math.max(c.len, 2);
    if (c.end === 'comma') ms += per * 2;
    if (c.end === 'stop') ms += per * 4;
    if (c.para) ms += per * 4;
    return ms;
  }

  return { chunk, duration, hasSegmenter: !!segmenter };
})();

/* ════════════════════════════════════════════════════════════
   画面
   ════════════════════════════════════════════════════════════ */
(() => {
  const $ = (id) => document.getElementById(id);
  const el = {
    page: $('page'), editView: $('editView'), readView: $('readView'), statusbar: $('statusbar'),
    source: $('source'), info: $('info'), stage: $('stage'), word: $('word'),
    seek: $('seek'), remain: $('remain'), posNow: $('posNow'), posAll: $('posAll'),
    btnPlay: $('btnPlay'), btnPrefs: $('btnPrefs'), prefsPanel: $('prefsPanel'), tsMincho: $('tsMincho'),
  };
  const STORE = 'halv-rsvp-v1';
  const LIMITS = { cpm: [200, 2000], maxLen: [3, 14] };
  const SAMPLE = '吾輩は猫である。名前はまだ無い。\nどこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。吾輩はここで始めて人間というものを見た。しかもあとで聞くとそれは書生という人間中で一番獰悪な種族であったそうだ。\n（夏目漱石『吾輩は猫である』より）';

  const set = { cpm: 600, maxLen: 8 };
  let chunks = [], pos = 0, timer = null, playing = false;

  // 設定 줄: 入力 畫面과 읽는 畫面의 設定 창에 같은 것을 넣는다
  document.querySelectorAll('[data-prefs]').forEach((box) => box.append($('prefsRows').content.cloneNode(true)));

  // 保存（この端末のこのブラウザだけ）
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || '{}');
      if (typeof s.text === 'string') el.source.value = s.text;
      for (const k of Object.keys(set)) if (Number.isFinite(s[k])) set[k] = clamp(k, s[k]);
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ text: el.source.value, ...set })); } catch (e) {}
  }
  function clamp(k, v) { return Math.min(Math.max(v, LIMITS[k][0]), LIMITS[k][1]); }

  // TypeSquare: 새 글자가 생기면 보이지 않는 칸에 보태고, 잠시 뒤 한 번 다시 받게 한다
  const tsSeen = new Set(el.tsMincho.textContent);
  let tsTimer = 0;
  function tsFeed(text) {
    let add = '';
    for (const ch of text) if (ch > 'ÿ' && !tsSeen.has(ch)) { tsSeen.add(ch); add += ch; }
    if (!add) return;
    el.tsMincho.textContent += add;
    clearTimeout(tsTimer);
    tsTimer = setTimeout(() => { if (window.Ts && Ts.loadFont) Ts.loadFont(); }, 900);
  }

  function fmtTime(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function showPrefs() {
    document.querySelectorAll('[data-val]').forEach((n) => { n.textContent = set[n.dataset.val]; });
    document.querySelectorAll('[data-step]').forEach((b) => {
      const k = b.dataset.step, d = Number(b.dataset.d);
      b.disabled = d < 0 ? set[k] <= LIMITS[k][0] : set[k] >= LIMITS[k][1];
    });
  }
  function updateInfo() {
    showPrefs();
    const text = el.source.value;
    if (!text.trim()) { el.info.textContent = RSVP.hasSegmenter ? '' : 'このブラウザでは語の区切りを文字の種類で推定します'; return; }
    const cs = RSVP.chunk(text, set.maxLen);
    const total = cs.reduce((a, c) => a + RSVP.duration(c, set.cpm), 0);
    el.info.textContent = cs.length + ' 区切り・約 ' + fmtTime(total);
  }
  function remainingMs() {
    let ms = 0;
    for (let i = pos; i < chunks.length; i++) ms += RSVP.duration(chunks[i], set.cpm);
    return ms;
  }

  // 長い区切りが表示面からはみ出すときだけ、字を小さくして収める
  function fit() {
    el.word.style.fontSize = '';
    const room = el.stage.clientWidth, need = el.word.scrollWidth;
    if (need > room && room > 0) {
      el.word.style.fontSize = (parseFloat(getComputedStyle(el.word).fontSize) * room / need * 0.96) + 'px';
    }
    center();
  }

  // 上下の目盛りのちょうど真ん中に字の墨（実際に描かれる部分）が来るようにずらす。
  // 行の高さは先頭の Newsreader の寸法で決まり、漢字・仮名・한글はその中で上に寄るため。
  // 区切りごとの墨ではなく、文字種ごとの基準字（国・한）で測る（区切りごとに上下に揺れないように）
  const ctx = document.createElement('canvas').getContext('2d');
  const probe = document.createElement('span');
  probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline';
  function center() {
    el.word.style.transform = '';
    const t = el.word.textContent;
    const ref = /[\u3040-\u30FF\u3400-\u9FFF\uF900-\uFAFF々〆]/u.test(t) ? '国' : /[\uAC00-\uD7A3]/u.test(t) ? '한' : '';
    if (!ref || el.word.classList.contains('is-end')) return;
    const cs = getComputedStyle(el.word);
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = ctx.measureText(ref);
    const inkMid = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;   // 基準線から上へ
    el.word.append(probe);
    const baseline = probe.getBoundingClientRect().top;
    probe.remove();
    const box = el.stage.getBoundingClientRect();
    el.word.style.transform = `translateY(${(box.top + box.height / 2) - (baseline - inkMid)}px)`;
  }

  function render() {
    const atEnd = pos >= chunks.length;
    el.word.classList.toggle('is-end', atEnd);
    el.word.textContent = atEnd ? 'おわり ― Space でもう一度' : chunks[pos].text;
    fit();
    const last = Math.max(chunks.length - 1, 0), at = Math.min(pos, last);
    el.seek.max = last;
    el.seek.value = at;
    el.seek.style.setProperty('--p', (last ? at / last * 100 : 0) + '%');
    el.posNow.textContent = Math.min(pos + 1, chunks.length);
    el.posAll.textContent = chunks.length;
    el.remain.textContent = fmtTime(remainingMs());
    el.btnPlay.textContent = playing ? '❚❚' : '▶︎';
    el.btnPlay.setAttribute('aria-label', playing ? '一時停止' : '再生');
  }

  function tick() {
    if (!playing) return;
    if (pos >= chunks.length) { stop(); return; }
    render();
    timer = setTimeout(() => { pos++; tick(); }, RSVP.duration(chunks[pos], set.cpm));
  }
  function play() {
    if (!chunks.length) return;
    if (pos >= chunks.length) pos = 0;
    playing = true;
    clearTimeout(timer);
    tick();
  }
  function stop() { playing = false; clearTimeout(timer); render(); }
  const toggle = () => (playing ? stop() : play());
  function step(d) {
    stop();
    pos = Math.min(Math.max(pos + d, 0), chunks.length - 1);
    render();
  }
  function change(k, d) {
    set[k] = clamp(k, set[k] + d);
    save();
    updateInfo();
    if (!el.readView.hidden) {
      if (k === 'maxLen') {   // 区切り直す。いま読んでいる所はおおよそ同じ割合の位置に
        const ratio = chunks.length ? pos / chunks.length : 0;
        chunks = RSVP.chunk(el.source.value, set.maxLen);
        pos = Math.min(Math.round(ratio * chunks.length), chunks.length - 1);
      }
      render();
    }
  }

  function togglePrefs(open) {
    const show = open ?? el.prefsPanel.hidden;
    el.prefsPanel.hidden = !show;
    el.btnPrefs.setAttribute('aria-expanded', String(show));
  }

  function openReader() {
    chunks = RSVP.chunk(el.source.value, set.maxLen);
    if (!chunks.length) { el.source.focus(); return; }
    save();
    tsFeed(el.source.value);
    pos = 0;
    el.editView.hidden = true;
    el.readView.hidden = false;
    el.statusbar.hidden = false;
    el.page.classList.add('is-reading');
    render();
    el.stage.focus();
    timer = setTimeout(play, 600);   // 最初の区切りに目を合わせる間（その間に止めれば始まらない）
  }
  function closeReader() {
    stop();
    togglePrefs(false);
    el.readView.hidden = true;
    el.statusbar.hidden = true;
    el.page.classList.remove('is-reading');
    el.editView.hidden = false;
    updateInfo();
    el.source.focus();
  }

  $('btnStart').addEventListener('click', openReader);
  $('btnSample').addEventListener('click', () => { el.source.value = SAMPLE; save(); tsFeed(SAMPLE); updateInfo(); });
  $('btnClear').addEventListener('click', () => { el.source.value = ''; save(); updateInfo(); el.source.focus(); });
  $('btnEdit').addEventListener('click', closeReader);
  $('btnPrev').addEventListener('click', () => step(-1));
  $('btnNext').addEventListener('click', () => step(1));
  el.btnPlay.addEventListener('click', toggle);
  el.btnPrefs.addEventListener('click', () => togglePrefs());
  el.stage.addEventListener('click', () => { if (!el.prefsPanel.hidden) togglePrefs(false); else toggle(); });
  document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => change(b.dataset.step, Number(b.dataset.d))));
  // マウスで押した後はフォーカスを表示面へ移す（Space がボタンにも効いて二度切り替わらないように）
  el.statusbar.querySelectorAll('button').forEach((b) => b.addEventListener('click', (e) => {
    if (e.detail > 0 && !el.readView.hidden && b !== el.btnPrefs && !el.prefsPanel.contains(b)) el.stage.focus();
  }));
  document.addEventListener('click', (e) => {
    if (!el.prefsPanel.hidden && !e.target.closest('.popprefs')) togglePrefs(false);
  });
  el.seek.addEventListener('input', () => { const v = Number(el.seek.value); stop(); pos = v; render(); });
  let srcTimer = 0;
  el.source.addEventListener('input', () => {
    save();
    updateInfo();
    clearTimeout(srcTimer);
    srcTimer = setTimeout(() => tsFeed(el.source.value), 1200);
  });
  window.addEventListener('resize', () => { if (!el.readView.hidden) fit(); });
  // 字体が後から届いたら（TypeSquare・Google Fonts）測り直す
  if (document.fonts) document.fonts.addEventListener('loadingdone', () => { if (!el.readView.hidden) fit(); });

  document.addEventListener('keydown', (e) => {
    if (el.readView.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target instanceof HTMLInputElement && e.target.type === 'range' && e.key.startsWith('Arrow')) return;
    if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;   // ボタンそのものに任せる
    const k = e.key;
    if (k === ' ' || k === 'Spacebar') { e.preventDefault(); toggle(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (k === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (k === 'ArrowUp') { e.preventDefault(); change('cpm', 50); }
    else if (k === 'ArrowDown') { e.preventDefault(); change('cpm', -50); }
    else if (k === 'Escape') { e.preventDefault(); if (!el.prefsPanel.hidden) togglePrefs(false); else closeReader(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing) stop(); });

  load();
  tsFeed(el.source.value);
  updateInfo();
})();
</script>
</body>
</html>
