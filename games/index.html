<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>게임</title>
<script>/* 한 글자 주소로: halv.kr/games → g.halv.kr */if(location.hostname==='halv.kr'||location.hostname==='www.halv.kr')location.replace('https://g.halv.kr'+location.pathname.replace(/^\/games/,'')+location.search+location.hash);</script>
<style>
:root { --bg: #fdfcf9; --ink: #1c1b18; --muted: #736e65; --rule: #d5cfc1; --accent: #639c59; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1b19; --ink: #e8e6e0; --muted: #a19b90; --rule: #47443c; } }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px 16px; line-height: 1.6; }
h1 { font-size: 1.3rem; margin: 0 0 18px; }
a.game { display: block; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 10px; color: inherit; text-decoration: none; }
a.game:hover { border-color: var(--accent); }
a.game b { font-size: 1.05rem; }
a.game small { color: var(--muted); margin-left: .4em; }
a.game p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<h1>게임</h1>
<a class="game" href="ilodici/"><b>일로디스</b><small>ilódici</small><p>차샤-하제크 문화의 3~4인 카드 게임. 81장의 일레지시리피에로 칸 세 개를 조로 채운다.</p></a>
</body>
</html>
