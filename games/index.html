<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>게임</title>
<script>/* 한 글자 주소로: halv.kr/games → g.halv.kr */if(location.hostname==='halv.kr'||location.hostname==='www.halv.kr')location.replace('https://g.halv.kr'+location.pathname.replace(/^\/games/,'')+location.search+location.hash);</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/font/un/unbatang.css?v=1">
<link rel="stylesheet" href="/font/un/undotum.css?v=1">
<script type="text/javascript" src="//typesquare.com/accessor/ko/script/typesquare.js?ee85a1e0da0743cc9ca6031dd3b19c5d" charset="utf-8"></script>
<style>
:root { --bg: #fdfcf9; --ink: #1c1b18; --muted: #736e65; --rule: #bdb6a6; --accent: #639c59;
  --ink-rule: color-mix(in srgb, var(--ink) 72%, var(--bg));
  --mincho: "Newsreader", "IshiiMincho Old R", "UnBatang", "Zen Old Mincho", "Hiragino Mincho ProN", serif;
  --gothic: "Newsreader", "IshiiGothic R", "UnDotum", "Apple SD Gothic Neo", sans-serif; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #1c1b18; --ink: #e6e2d8; --muted: #a19b90; --rule: #5a564d; --accent: #7fb874; } }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--mincho); max-width: 640px; margin: 0 auto; padding: 2.4rem 16px 3rem; line-height: 1.6; }
header { position: relative; text-align: center; padding-bottom: 1.4rem; }
header h1 { margin: 0; font-size: 2.2rem; font-weight: 400; letter-spacing: .1em; line-height: 1; }
header p { margin: .4rem 0 0; font-style: italic; color: var(--muted); }
header::after { content: ""; position: absolute; inset: auto 0 0; height: 2px; border-top: 2.5px solid var(--ink-rule); border-bottom: 1px solid var(--ink-rule); }
ol { list-style: none; margin: 2.2rem 0 0; padding: 0; }
li a { display: flex; align-items: baseline; gap: .6rem; padding: 0 .5rem; color: inherit; text-decoration: none; }
li a i { flex: 1; min-width: 1.5rem; border-bottom: 1.5px dotted var(--rule); transform: translateY(-.3em); }
li a:hover b { color: var(--accent); }
li a small { font-style: italic; color: var(--muted); }
li .d { margin: .25rem 0 0; padding: 0 .5rem; color: var(--muted); font-family: var(--gothic); font-size: .85rem; }
.ts { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); font-family: "IshiiMincho Old R"; }
</style>
</head>
<body>
<header><h1>遊戲</h1><p>games</p></header>
<ol>
  <li><a href="ilodici/"><b>일로디스</b><small>ilódici</small><i></i><span>3~4인</span></a>
    <p class="d">차샤-하제크 문화의 카드 게임</p></li>
</ol>
<div class="ts" aria-hidden="true">遊戲文化</div>
</body>
</html>
